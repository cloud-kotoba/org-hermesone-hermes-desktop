appId: cloud.kotoba.desktop
# productName is now space-free so the Linux .deb installs to
# /opt/HermesOne/hermes-agent instead of `/opt/Hermes One/hermes-agent`.
# The previous path crashed Chromium's zygote on launch because
# argv[0] containing whitespace is forwarded verbatim into execvp and
# fails with EINVAL (SIGTRAP). See issue #877.
#
# The user-facing display name "Hermes One" is restored through
# `linux.desktop.entry.Name`, `nsis.shortcutName`, `nsis.uninstallDisplayName`,
# and `mac.extendInfo.CFBundleDisplayName` so end users see no change.
productName: Kotoba
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/prebuilds/*.node
win:
  executableName: kotoba
  target:
    - nsis
    - portable
portable:
  artifactName: ${name}-${version}-portable.${ext}
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  # Restore user-facing installer / shortcut name now that productName is
  # space-free.
  shortcutName: Kotoba
  uninstallDisplayName: Kotoba
  createDesktopShortcut: always
  oneClick: true
  perMachine: false
mac:
  # Keep the existing bundle/executable name used by updates and release checks.
  executableName: Kotoba
  artifactName: ${name}-${version}-${arch}-${os}.${ext}
  icon: build/icon.icns
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - CFBundleDisplayName: Kotoba
  hardenedRuntime: true
  gatekeeperAssess: false
  # No Developer ID Application certificate exists in this workspace yet
  # (only App Store distribution certs; see the fork README). Builds are
  # unsigned until one is obtained -- stated on the download page.
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  # snap / rpm need snapcraft / rpmbuild, which the macOS build hosts
  # (murakumo fleet) do not have; AppImage + deb build anywhere.
  target:
    - AppImage
    - deb
  maintainer: Kotoba Cloud <support@kotoba.cloud>
  vendor: Kotoba Cloud
  category: Utility
  synopsis: Kotoba desktop app for Hermes Agent
  description: >-
    Kotoba is a native desktop app for installing, configuring, and chatting
    with Hermes Agent, wired to Kotoba Cloud inference by default. A fork of
    Hermes One (fathah/hermes-desktop).
  # Override the user-facing .desktop display name (default would now be
  # "HermesOne" since productName is space-free). See issue #877.
  desktop:
    entry:
      Name: Kotoba
      Comment: Kotoba — Hermes Agent desktop app on Kotoba Cloud
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
deb:
  # Run chmod 4755 on chrome-sandbox so Electron's setuid sandbox helper
  # works on modern Linux distros that disable unprivileged user
  # namespaces (Ubuntu 24.04+, etc.). Closes #395.
  afterInstall: build/linux-after-install.sh
rpm:
  artifactName: ${name}-${version}.${ext}
  # Same SUID fix for .rpm consumers (Fedora 40+ also restricts userns).
  afterInstall: build/linux-after-install.sh
npmRebuild: false
# Auto-update feed: electron-updater's generic provider reads latest-mac.yml /
# latest-linux.yml / latest.yml next to the artifacts, all served from
# app.kotoba.cloud/download/ (the same place the download page links to).
# Pointing this at upstream's GitHub releases would make the fork update
# itself back into Hermes One.
publish:
  provider: generic
  url: https://app.kotoba.cloud/download/
