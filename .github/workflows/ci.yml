name: CI

# Runs the type checker and test suite on every PR and on pushes to main,
# so broken code is caught before it merges. Mirrors the Node version and
# install step already used by release.yml.

on:
  pull_request:
  push:
    branches: [main]

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

  # The Hy gateway (gateway-hy/) runs under Hermes Agent's Python, so its
  # tests run on the oldest Python Hermes supports and on the 3.14 that
  # Hermes' managed runtime uses. They use the echo backend and need no
  # Hermes install: only Hy (vendored by gateway:deps) and cryptography.
  gateway:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    env:
      HERMES_PYTHON: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: python -m pip install -r gateway-hy/requirements-test.txt

      - name: Vendor Hy
        run: node scripts/gateway-hy.mjs deps

      - name: Check the Python view compiles
        run: node scripts/gateway-hy.mjs hy2py --check

      - name: Gateway tests
        run: node scripts/gateway-hy.mjs test
